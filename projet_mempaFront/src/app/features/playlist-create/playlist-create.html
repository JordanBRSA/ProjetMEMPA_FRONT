<div class="auth-container d-flex flex-column align-items-center justify-content-center">
  <div class="auth-box d-flex flex-column">
    <h1 class="title">Nouvelle Playlist</h1>

    <div class="d-flex flex-column gap-3">
      <div class="d-flex flex-column">
        <label for="nom">Nom de la playlist</label>
        <input id="nom" type="text" [(ngModel)]="nom_playlist" name="nom" class="auth-input"/>
      </div>
      <div class="d-flex flex-column">
        <label for="style">Style de musique</label>
        <select id="style" [(ngModel)]="style_musique" name="style" class="auth-input">
          <option value="" disabled>Choisir un style</option>
          <option *ngFor="let s of styles" [value]="s">{{ s }}</option>
        </select>
      </div>
    </div>

    <p class="message" *ngIf="message">{{ message }}</p>

    <button class="btn-submit mt-4" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Création...' : 'Créer' }}
    </button>

    <p class="toggle-link mt-3" routerLink="/">Annuler</p>
  </div>
</div>
