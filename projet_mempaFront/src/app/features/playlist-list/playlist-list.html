<div class="playlist-container d-flex flex-column w-100">
  <div class="d-flex flex-row justify-content-between">
    <button class="btn d-flex flex-row align-items-center" (click)="onFilterPlaylist()">
      <img ngSrc="images/filtre_icon.png" alt="Filtrer" height="47" width="47" priority>
      <p class="filtre-txt">Filtrer</p>
    </button>

    <h1 class="title">Playlist</h1>

    <div class="d-flex flex-row gap-2">
      <button class="btn" (click)="onLogout()">
        <img ngSrc="images/user_icon.png" alt="Déconnexion" height="47" width="47" priority>
      </button>
      <button class="btn" (click)="onCreatePlaylist()">
        <img ngSrc="images/plus_icon.png" alt="Ajouter" height="47" width="47" priority>
      </button>
    </div>
  </div>

  <!-- Filtre -->
  <div *ngIf="showFilter" class="filter-panel d-flex flex-row gap-3 align-items-end my-3">
    <div class="d-flex flex-column">
      <label>Recherche</label>
      <input type="text" [(ngModel)]="searchQuery" placeholder="Nom ou style..." class="filter-input"/>
    </div>

    <div class="d-flex flex-column">
      <label>Trier par</label>
      <select [(ngModel)]="sortBy" class="filter-input">
        <option value="">-- Aucun --</option>
        <option value="nom_playlist">Nom</option>
        <option value="style_musique">Style</option>
        <option value="nbClick">Clics</option>
      </select>
    </div>

    <div class="d-flex flex-column">
      <label>Ordre</label>
      <select [(ngModel)]="order" class="filter-input">
        <option value="ASC">Croissant</option>
        <option value="DESC">Décroissant</option>
      </select>
    </div>

    <button class="btn-submit px-3" (click)="onSearch()">Rechercher</button>
    <button class="btn-reset px-3" (click)="onReset()">Réinitialiser</button>
  </div>

  <!-- Playlists -->
  <div *ngFor="let playlist of playlists" class="mb-3">
    <a [routerLink]="['/playlist', playlist.id]" class="text-decoration-none text-dark">
      <div class="card-body">
        <h5 class="card-title">{{ playlist.name }}</h5>
        <div class="d-flex flex-row justify-content-between px-3 card-info">
          <div>Style : {{ playlist.style }}</div>
          <div>Clics : {{ playlist.clicks }}</div>
        </div>
      </div>
    </a>
  </div>
</div>
